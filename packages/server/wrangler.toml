name = "duo-chess"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Comma-separated, no spaces. Includes both local dev origins (vite dev / vite
# preview) and the production Vercel domain, since this one list is used for
# both `wrangler dev` and `wrangler deploy` — there's no separate prod config.
# Update this if the Vercel project name or a custom domain ever changes.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://duo-chess.vercel.app"
